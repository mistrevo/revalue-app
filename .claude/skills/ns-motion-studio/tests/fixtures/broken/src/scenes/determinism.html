  <p class="t a" data-ms-text="t07"></p>
<script>
  // 前のフレームからの経過（Date.now() の差）で色を決める。描く順序で絵が変わる
  let prev = Date.now();
  ms.scene(() => {
    const dt = Date.now() - prev;
    prev = Date.now();
    document.body.style.background = `hsl(${Math.abs(dt) % 360}, 60%, 20%)`;
  });
</script>
