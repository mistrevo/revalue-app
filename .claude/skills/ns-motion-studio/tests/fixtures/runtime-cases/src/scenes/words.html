<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c11</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; color: #1f2430; font-family: sans-serif; }
  /* 角を丸く切り抜いた札（clip-path）。札の中の見出しは語ごとの span に分け、改行は原稿の \n */
  .plate { position: absolute; left: 100px; width: 900px; height: 250px; background: #ffc23d; border-radius: 44px;
           clip-path: inset(0px 0px 0px 0px round 44px); }
  .plate p { position: absolute; left: 40px; top: 20px; margin: 0; font-size: 72px; line-height: 1.3; font-weight: 700; white-space: pre-line; }
  /* 3行目が札の下の端で切れたままになる見出し。語ごとに下から上がって現れる */
  .p1 { top: 40px; }
  /* 同じ見出しを、動かさずに置いたもの */
  .p2 { top: 330px; }
  /* 2行で札に収まる見出し。語ごとに下から上がって現れる */
  .p3 { top: 620px; }
</style>
</head>
<body>
  <div class="plate p1"><p data-ms-text="t28"></p></div>
  <div class="plate p2"><p data-ms-text="t29"></p></div>
  <div class="plate p3"><p data-ms-text="t30"></p></div>
<script>
  /** 語ごとの span に分ける（空白と改行は文字ノードのまま残す） */
  function splitWords(id) {
    const el = document.querySelector('[data-ms-text="' + id + '"]');
    const nodes = ms.text(id).split(/(\s+)/).filter(Boolean).map((w) => (/^\s+$/.test(w)
      ? document.createTextNode(w)
      : Object.assign(document.createElement('span'), { textContent: w })));
    el.replaceChildren(...nodes);
    const spans = nodes.filter((n) => n.nodeType === 1);
    for (const s of spans) { s.style.display = 'inline-block'; s.style.whiteSpace = 'pre'; }
    return spans;
  }
  const moving = [...splitWords('t28'), ...splitWords('t30')];
  splitWords('t29');
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  ms.scene((t) => {
    // 語ごとに 0.09 秒ずつずらして、透明から 0.6 秒で、40px 下から上がる
    moving.forEach((w, i) => {
      const p = ms.ease.outExpo(clamp01((t - 0.1 - (i % 6) * 0.09) / 0.6));
      w.style.opacity = String(clamp01(p / 0.4));
      w.style.transform = 'translateY(' + ((1 - p) * 40).toFixed(2) + 'px)';
    });
  });
</script>
</body>
</html>
