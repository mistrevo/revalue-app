<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c03</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; }
  /* transition は前のフレームの値から動き出すので、撮る順序で絵が変わる。ランタイムが止める */
  .box { position: absolute; left: 10%; top: 20%; width: 40%; height: 60%; background: #38bdf8; transition: opacity 1s linear, transform 1s linear; }
</style>
</head>
<body>
  <div class="box"></div>
<script>
  const box = document.querySelector('.box');
  ms.scene((t) => {
    box.style.opacity = String(t / 1.5);
    box.style.transform = `translateX(${t * 100}px)`;
  });
</script>
</body>
</html>
