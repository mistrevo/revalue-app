<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c12</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; color: #1f2430; font-family: sans-serif; }
  p { position: absolute; margin: 0; font-size: 80px; line-height: 1.2; font-weight: 700; white-space: nowrap; }
  .sh { position: absolute; }
  /* 見出しの上に、あとから描く四角が重なったまま（文字の一部が隠れ続ける） */
  .t31 { left: 100px; top: 100px; }
  .sq { left: 520px; top: 60px; width: 200px; height: 200px; background: #3da5ff; }
  /* 見出しの後ろ（先に描く）を、丸が横切る */
  .t32 { left: 100px; top: 400px; }
  .dot { left: 0; top: 380px; width: 160px; height: 160px; border-radius: 50%; background: #ffc23d; }
  /* 見出しの上を、帯が 0.25 秒で横切る（転換の一瞬） */
  .t33 { left: 100px; top: 700px; }
  .bar { left: -150px; top: 660px; width: 120px; height: 200px; background: #ff6b4a; }
  /* 見出しの上に 1 秒重なる、わざと通す拭き取りの面（data-ms-wipe） */
  .t34 { left: 1000px; top: 700px; }
  .wipe { left: 1000px; top: 660px; width: 300px; height: 200px; background: #2ec4a6; }
</style>
</head>
<body>
  <div class="sh dot"></div>
  <p class="t31" data-ms-text="t31"></p>
  <p class="t32" data-ms-text="t32"></p>
  <p class="t33" data-ms-text="t33"></p>
  <p class="t34" data-ms-text="t34"></p>
  <div class="sh sq"></div>
  <div class="sh bar"></div>
  <div class="sh wipe" data-ms-wipe></div>
<script>
  const dot = document.querySelector('.dot');
  const bar = document.querySelector('.bar');
  const wipe = document.querySelector('.wipe');
  ms.scene((t) => {
    dot.style.transform = 'translateX(' + (t * 300).toFixed(2) + 'px)';
    // 1.0〜1.25 秒だけ、左から右へ 3000px/秒 で横切る
    const on = t >= 1 && t < 1.25;
    bar.style.display = on ? 'block' : 'none';
    bar.style.transform = 'translateX(' + (on ? (t - 1) * 3000 : 0).toFixed(2) + 'px)';
    wipe.style.display = t < 1 ? 'block' : 'none';
  });
</script>
</body>
</html>
