<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c14</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; color: #1f2430; font-family: sans-serif; }
  p { position: absolute; margin: 0; font-size: 80px; line-height: 1.6; font-weight: 700; white-space: nowrap; }
  .sh { position: absolute; }
  /* 下線の帯: 文字より手前に描くが、行の下の余白（字の下）にあり、字を隠さない */
  .t36 { left: 100px; top: 60px; }
  .under { left: 100px; top: 152px; width: 580px; height: 12px; background: #3da5ff; }
  /* 乗算で重ねた蛍光ペンの帯: 手前にあるが、字は透けて読める */
  .t37 { left: 100px; top: 300px; }
  .marker { left: 240px; top: 330px; width: 240px; height: 90px; background: #ffc23d; mix-blend-mode: multiply; }
  /* oklch() の色の四角が、字の一部を隠したまま */
  .t38 { left: 100px; top: 540px; }
  .ok { left: 520px; top: 540px; width: 200px; height: 128px; background: oklch(0.7 0.15 250); }
  /* color-mix() の色の四角が、字の一部を隠したまま */
  .t39 { left: 100px; top: 780px; }
  .mix { left: 520px; top: 780px; width: 200px; height: 128px; background: color-mix(in srgb, #ff6b4a 60%, #2ec4a6); }
</style>
</head>
<body>
  <p class="t36" data-ms-text="t36"></p>
  <p class="t37" data-ms-text="t37"></p>
  <p class="t38" data-ms-text="t38"></p>
  <p class="t39" data-ms-text="t39"></p>
  <div class="sh under"></div>
  <div class="sh marker"></div>
  <div class="sh ok"></div>
  <div class="sh mix"></div>
<script>
  ms.scene(() => {});
</script>
</body>
</html>
