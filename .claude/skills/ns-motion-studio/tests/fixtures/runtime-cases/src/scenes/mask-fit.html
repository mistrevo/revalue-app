<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c07</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; color: #ffffff; font-family: 'Noto Sans JP', sans-serif; }
  p { margin: 0; font-size: 80px; white-space: nowrap; }
  /* 行のマスク: 行の高さ 1.05 の見出しを、ぴったりの overflow: hidden の箱から出し終えたところ。
     文字ノードの箱（字面の上下の余白を含む、約 1.45em）は箱より高いが、切れてはいない */
  .mask { position: absolute; left: 100px; top: 100px; overflow: hidden; }
  .mask p { line-height: 1.05; }
  /* 流れる文字（マーキー）: 窓より長い文字を横へ流す。data-ms-scroll の箱の中は、切れたままでよい */
  .ticker { position: absolute; left: 100px; top: 300px; width: 600px; height: 100px; overflow: hidden; }
  .ticker p { position: absolute; left: 0; top: 0; line-height: 100px; transform: translateX(-200px); }
  /* 流れるクレジット: 窓より高い文字の列を縦へ流す */
  .roll { position: absolute; left: 900px; top: 300px; width: 800px; height: 200px; overflow: hidden; }
  .roll p { line-height: 100px; white-space: normal; transform: translateY(-50px); }
  /* 省略記号で切った文字は、テロップの誤りとして指摘する */
  .ellipsis { position: absolute; left: 100px; top: 600px; width: 300px; line-height: 100px; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="mask"><p data-ms-text="t12"></p></div>
  <div class="ticker" data-ms-scroll><p data-ms-text="t13"></p></div>
  <div class="roll" data-ms-scroll><p data-ms-text="t14"></p></div>
  <p class="ellipsis" data-ms-text="t15"></p>
<script>
  ms.scene(() => {});
</script>
</body>
</html>
