<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c06</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; color: #ffffff; font-family: system-ui, sans-serif; }
  p { margin: 0; font-size: 60px; line-height: 100px; height: 100px; white-space: nowrap; }
  /* 位置を決めていない（static）箱の overflow は、その中の absolute や fixed の文字を切らない */
  .card { overflow: hidden; width: 300px; height: 80px; }
  .abs { position: absolute; left: 600px; top: 400px; }
  .fixed { position: fixed; left: 100px; top: 700px; }
  /* 画面いっぱいの舞台の箱（overflow: hidden）。中の文字が画面の右の端で切れる */
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .edge { position: absolute; left: 1700px; top: 600px; }
  /* 小さすぎる箱で、文字の右側がずっと隠れたまま */
  .small { position: absolute; left: 100px; top: 850px; width: 200px; height: 100px; overflow: hidden; }
  .small p { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
  <div class="card"><p class="abs" data-ms-text="t07"></p></div>
  <p class="abs" data-ms-text="t08"></p>
  <div class="card"><p class="fixed" data-ms-text="t09"></p></div>
  <div id="stage">
    <p class="edge" data-ms-text="t10"></p>
    <div class="small"><p data-ms-text="t11"></p></div>
  </div>
<script>
  ms.scene(() => {});
</script>
</body>
</html>
