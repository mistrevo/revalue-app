<!doctype html>
<html lang="ja">
<head>

<title>c09</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; color: #ffffff; font-family: 'Noto Sans JP', sans-serif; }
  /* 行の高さ normal の札。Noto Sans JP の字面の箱（約 1.45em）は札の高さ 1.3em より高いが、字そのもの（1em）は収まる */
  .badge { position: absolute; left: 100px; top: 100px; display: inline-block; height: 1.3em; padding: 0 .5em;
    font-size: 20px; line-height: normal; white-space: nowrap; background: #1e3a8a; }
  /* 同じ形の札で、overflow: hidden で切るもの。字は切れていない */
  .clip { top: 200px; overflow: hidden; }
</style>
</head>
<body>
  <span class="badge" data-ms-text="t22"></span>
  <span class="badge clip" data-ms-text="t23"></span>

</script>
</body>
