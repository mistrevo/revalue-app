<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c05</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; color: #ffffff; font-family: system-ui, sans-serif; }
  .t { position: absolute; left: 100px; margin: 0; font-size: 60px; line-height: 100px; height: 100px; white-space: nowrap; }
  /* 行のマスク: 外の箱（overflow: hidden）の中で、文字を下へ 50px ずらす。見えるのは上の半分 */
  .win { position: absolute; left: 100px; top: 100px; width: 800px; height: 100px; overflow: hidden; }
  .win .t { left: 0; top: 0; transform: translateY(50px); }
  /* 切り抜き: 自分の箱の下の半分を clip-path で隠す */
  .clip { top: 300px; clip-path: inset(0 0 50% 0); }
  /* 全部隠れる */
  .gone { top: 500px; clip-path: inset(0 0 100% 0); }
  /* 行ごとの span: 2行目はまだマスクの中（下へ 100px ずらし、全部を切り抜く） */
  .lines { position: absolute; left: 1000px; top: 300px; margin: 0; font-size: 60px; line-height: 100px; }
  .lines span { display: block; height: 100px; white-space: nowrap; }
  .lines span + span { transform: translateY(100px); clip-path: inset(0 0 100px 0); }
</style>
</head>
<body>
  <div class="win"><p class="t" data-ms-text="t03"></p></div>
  <p class="t clip" data-ms-text="t04"></p>
  <p class="t gone" data-ms-text="t05"></p>
  <p class="lines" data-ms-text="t06"></p>
<script>
  const l = document.querySelector('.lines');
  l.replaceChildren(...['上の行', '下の行'].map((x) => Object.assign(document.createElement('span'), { textContent: x })));
  ms.scene(() => {});
</script>
</body>
</html>
