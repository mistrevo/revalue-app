<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>c13</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #ffffff; color: #1f2430; font-family: sans-serif; }
  p { position: absolute; left: 100px; top: 300px; margin: 0; font-size: 120px; font-weight: 700; white-space: nowrap; }
  .plate { position: absolute; left: 60px; top: 260px; width: 1000px; height: 240px; background: #3da5ff; transform-origin: left center; }
</style>
</head>
<body>
  <div class="plate"></div>
  <p data-ms-text="t35"></p>
<script>
  // 前のカット（絵のある最後のコマ）から切り替わった最初のコマ（0 秒）だけ何も無く、次のコマから面が出ている（1コマだけ空になる、ちらつき）。
  // body の data-start で入り方を替える:
  //   hole2 … 最初の 0.03 秒（60fps の2コマ）だけ何も無く、次のコマから面が出ている（2コマの穴）
  //   held … 最初のコマから面が半分開いている（つなぎ目で画面が空にならない）
  //   fade … 0.5 秒かけて、何も無い地から一様に現れる（ふつうの入場）
  //   ease … 0.5 秒かけて、何も無い地から outCubic で現れる（出だしの速い、ふつうの入場）
  //   expo … 0.4 秒かけて、何も無い地から outExpo で現れる（motion-rules の勧める速さ）
  //   gradease … 淡いグラデーション（#ffffff → #ececec）の地の上で、ease と同じに現れる
  //   wipe … 0.6 秒かけて、左から一様に拭き取るように開く（ふつうの入場）
  const plate = document.querySelector('.plate');
  const text = document.querySelector('p');
  const mode = document.body.dataset.start;
  if (mode === 'gradease') document.body.style.background = 'linear-gradient(#ffffff, #ececec)';
  ms.scene((t) => {
    const p = t > (mode === 'hole2' ? 0.03 : 0.001) ? 1 : 0;
    let scale = mode === 'held' ? Math.max(0.5, p) : p, alpha = scale;
    if (mode === 'fade') { scale = 1; alpha = Math.min(1, t / 0.5); }
    if (mode === 'expo') { scale = 1; alpha = ms.ease.outExpo(Math.min(1, t / 0.4)); }
    if (mode === 'ease' || mode === 'gradease') { scale = 1; alpha = 1 - (1 - Math.min(1, t / 0.5)) ** 3; }
    if (mode === 'wipe') { scale = Math.min(1, t / 0.6); alpha = 1; }
    plate.style.transform = 'scaleX(' + scale.toFixed(3) + ')';
    plate.style.opacity = String(alpha);
    text.style.opacity = String(mode === 'wipe' ? (t >= 0.6 ? 1 : 0) : alpha);
  });
</script>
</body>
</html>
