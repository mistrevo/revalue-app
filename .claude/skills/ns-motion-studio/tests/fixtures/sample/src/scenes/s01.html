<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>s01</title>
<!-- ランタイム（ms-runtime.js）は書き出しの道具がページへ注入する -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; color: #ffffff; font-family: system-ui, sans-serif; }
  .title { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 120px; font-weight: 700; }
  /* CSS のアニメーションも seek で止めて時刻を合わせる */
  .bar { position: absolute; left: 30%; width: 40%; top: 62%; height: 8px; background: #38bdf8;
    transform-origin: left center; animation: grow 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #38bdf8; }
</style>
</head>
<body>
  <div class="title" data-ms-text="t01"></div>
  <div class="bar"></div>
  <div id="dots"></div>
<script>
  const title = document.querySelector('.title');
  const dots = document.getElementById('dots');
  for (let i = 0; i < 12; i++) dots.appendChild(Object.assign(document.createElement('div'), { className: 'dot' }));

  ms.scene((t) => {
    const p = ms.ease.outExpo(Math.min(Math.max((t - 0.1) / 0.6, 0), 1));
    title.style.opacity = String(p);
    title.style.transform = `translateY(${(1 - p) * 40}px)`;
    // ms.rand は seek のたびに seed から始まるので、毎フレーム同じ配置になる
    for (const d of dots.children) {
      d.style.left = `${ms.rand() * 100}%`;
      d.style.top = `${ms.rand() * 30 + (1 - p) * 10}%`;
      d.style.opacity = String(p * 0.6);
    }
  });
</script>
</body>
</html>
