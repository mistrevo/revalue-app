<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>s02</title>
<!-- ランタイム（ms-runtime.js）は書き出しの道具がページへ注入する -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  /* 後の点検で背景色を拾うので、このシーンだけの単色にしておく */
  body { background: #0b3d91; color: #ffffff; font-family: system-ui, sans-serif; }
  .title { position: absolute; left: 0; right: 0; top: 42%; text-align: center; font-size: 110px; font-weight: 700; }
</style>
</head>
<body>
  <div class="title" data-ms-text="t02"></div>
<script>
  const title = document.querySelector('.title');
  ms.scene((t) => {
    const p = ms.ease.outQuint(Math.min(Math.max((t - 0.1) / 0.5, 0), 1));
    title.style.opacity = String(p);
    title.style.transform = `scale(${0.9 + 0.1 * p})`;
  });
</script>
</body>
</html>
