<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シーン</title>
<!--
  ランタイム（scripts/runtime/ms-runtime.js）は、書き出し・静止画・点検の道具がページの読み込み前に注入する。
  ここで <script src> を書かない（シーンにプラグインの場所を書かないため）。
  ランタイムは <html data-ratio="16:9"> を自動で付け、data-ms-text の要素へ timeline.json の文字を流し込む。
  style.md の「既定から外すこと」で決めた演出の要素には data-ms-intent="contrast overflow" のように点検の名前を付ける（composition.md）。
-->
<!-- 制作フォルダの assets/fonts/fonts.css（フォントを取得したときに作られる） -->
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #111827; color: #ffffff; font-family: system-ui, sans-serif; }

  /* ---- 16:9（既定のレイアウト） ---- */
  .title { position: absolute; left: 8%; right: 8%; top: 40%; font-size: 96px; font-weight: 700; }

  /* ---- 比率ごとのレイアウト。切り抜きではなく、比率ごとに組み直す ---- */
  [data-ratio="9:16"] .title { top: 35%; font-size: 88px; }
  [data-ratio="1:1"] .title { font-size: 88px; }
  [data-ratio="4:5"] .title { font-size: 88px; }

  /* CSS のアニメーション（@keyframes）はシーンの先頭で始まったものとして時刻を合わせる。開始のずれは animation-delay で書く。
     CSS のトランジション（transition）はランタイムが止める。動きは draw か @keyframes で書く */
</style>
</head>
<body>
  <!-- 文字は直書きしない。data-ms-text に timeline.json の texts の id を書く -->
  <div class="title" data-ms-text="t01"></div>
<script>
  const title = document.querySelector('.title');

  // draw はシーン内の時刻 t（秒）だけから絵を決める。時計・requestAnimationFrame・前のフレームの状態に頼らない。
  // 使えるもの: ms.ease.outExpo など、ms.spring({damping, stiffness})(t)、ms.rand()（seek のたびに seed から始まる）、
  // ms.text(id)、ms.time(id)（そのテキストの {start, end}。入場の時刻はここから決める）、ms.ratio、ms.duration。GSAP を使うなら paused のタイムラインを作り、ここで tl.seek(t) を呼ぶ。
  // setTimeout / setInterval は読み込みの間だけ使える。描き始めた後（ready() の後）に呼ぶと例外になる。
  ms.scene((t) => {
    const p = ms.ease.outExpo(Math.min(Math.max(t / 0.6, 0), 1));
    title.style.opacity = String(p);
    title.style.transform = `translateY(${(1 - p) * 40}px)`;
  });
</script>
</body>
</html>
