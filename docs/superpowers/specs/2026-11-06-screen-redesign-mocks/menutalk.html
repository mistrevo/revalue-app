<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>案 A トークの下にメニュー板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 500; color: {{c.text}}">
<header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: {{c.surface}}; border-bottom: 1px solid {{c.border}}">
<div style="width: 40px; height: 40px; border-radius: 20px; background: {{c.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 17px; font-weight: 700">聞き手</div>
<div style="font-size: 13px; color: {{c.muted}}">きのうの朝の話</div>
</div>
</header>
<div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px">
<div style="align-self: center; font-size: 12px; color: {{c.muted}}; background: {{c.chip}}; border-radius: 999px; padding: 4px 12px">11月5日（水）</div>
<div style="align-self: flex-start; max-width: 82%; background: {{c.surface}}; border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 16px; line-height: 1.7">前の晩には、どんなことをしていましたか？</div>
<div style="align-self: flex-end; max-width: 82%; background: {{c.tint}}; color: {{c.onTint}}; border-radius: 18px 4px 18px 18px; padding: 12px 14px; font-size: 16px; line-height: 1.7">寝る前に、時間割を一緒に見て、ランドセルに入れるのを見ていました。</div>
<div style="align-self: flex-start; max-width: 82%; background: {{c.surface}}; border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 16px; line-height: 1.7">入れるところまで見届けたんですね。そのとき、いちばん気をつけていたのはどんなことでしたか？</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1.5px solid {{c.accent}}; border-radius: 999px; background: {{c.surface}}; color: {{c.accent}}; font-family: inherit; font-size: 15px; font-weight: 700">忘れ物がないこと</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1.5px solid {{c.accent}}; border-radius: 999px; background: {{c.surface}}; color: {{c.accent}}; font-family: inherit; font-size: 15px; font-weight: 700">子どもが自分でできること</button>
</div>
</div>
<div style="background: {{c.surface}}; border-top: 1px solid {{c.border}}; padding: 10px 12px">
<div style="display: flex; align-items: flex-end; gap: 8px">
<label for="m-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">答えを書く</label>
<textarea id="m-answer" rows="1" placeholder="思い出したことを、そのまま書いてください" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid {{c.fieldBorder}}; border-radius: 22px; padding: 12px 16px; font-family: inherit; font-size: 15px; font-weight: 500; line-height: 1.5; resize: none; background: {{c.field}}; color: {{c.text}}"></textarea>
<button type="button" aria-label="声で入力する" style="width: 48px; height: 48px; flex-shrink: 0; border: 1.5px solid {{c.fieldBorder}}; border-radius: 24px; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.text}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
<button type="button" aria-label="送る" style="width: 48px; height: 48px; flex-shrink: 0; border: 0; border-radius: 24px; background: {{c.accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.onAccent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</div>
<nav aria-label="メニュー" style="background: {{c.surface}}; border-top: 1px solid {{c.border}}; padding: 0 12px 18px">
<button type="button" style="width: 100%; min-height: 40px; border: 0; background: transparent; color: {{c.muted}}; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
<span>メニューをたたむ</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="#" style="min-height: 72px; border-radius: 14px; background: {{c.tile}}; color: {{c.text}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 700">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path><path d="M9 11h6M9 14h4"></path></svg>
<span>話したこと</span>
</a>
<a href="#" style="position: relative; min-height: 72px; border-radius: 14px; background: {{c.tile}}; color: {{c.text}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 700">
<span style="position: absolute; top: 6px; right: 6px; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px">新着</span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
<span>見えた力</span>
</a>
<a href="#" style="min-height: 72px; border-radius: 14px; background: {{c.tile}}; color: {{c.text}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 700">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h4"></path></svg>
<span>5 つの記録</span>
</a>
<a href="#" style="min-height: 72px; border-radius: 14px; background: {{c.tile}}; color: {{c.text}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 700">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
<span>仕事の選択肢</span>
</a>
<a href="#" style="min-height: 72px; border-radius: 14px; background: {{c.tile}}; color: {{c.text}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 700">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>
<span>まとめ</span>
</a>
<a href="#" style="min-height: 72px; border-radius: 14px; background: {{c.tile}}; color: {{c.text}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 700">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>
<span>設定</span>
</a>
</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["teal","rose","green","blue","orange","purple"],"default":"teal"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const P = {
teal: { ground: '#F2F4F1', surface: '#FFFFFF', text: '#262A2B', muted: '#5B6265', border: '#E1E5E2', accent: '#1F7A6E', onAccent: '#FFFFFF', tint: '#DCEFEA', onTint: '#1B3B36', tile: '#EEF5F2', chip: '#E4E9E6', field: '#F7F9F8', fieldBorder: '#CBD2CE' },
rose: { ground: '#F8F3F3', surface: '#FFFFFF', text: '#2E2627', muted: '#6A5A5D', border: '#EBDDDF', accent: '#B4475A', onAccent: '#FFFFFF', tint: '#FBE4E8', onTint: '#5A1F2B', tile: '#FBEEF0', chip: '#EFE4E5', field: '#FBF7F7', fieldBorder: '#D9C9CC' },
green: { ground: '#F3F6F0', surface: '#FFFFFF', text: '#262B24', muted: '#56604F', border: '#DEE6D9', accent: '#3A7D2C', onAccent: '#FFFFFF', tint: '#E3F1DC', onTint: '#1F3D18', tile: '#EDF4E8', chip: '#E3EADF', field: '#F7FAF5', fieldBorder: '#C9D3C3' },
blue: { ground: '#F2F5F9', surface: '#FFFFFF', text: '#242A33', muted: '#545F6E', border: '#DCE3EC', accent: '#2F5D9E', onAccent: '#FFFFFF', tint: '#E1EAF7', onTint: '#1A2F52', tile: '#EAF0F9', chip: '#E1E7EF', field: '#F6F8FB', fieldBorder: '#C7D0DC' },
orange: { ground: '#FAF6F0', surface: '#FFFFFF', text: '#2E2924', muted: '#665B4E', border: '#EADFD1', accent: '#B05A00', onAccent: '#FFFFFF', tint: '#FCEBD5', onTint: '#5A3200', tile: '#FBF0E2', chip: '#EFE7DC', field: '#FBF8F4', fieldBorder: '#D8CBBA' },
purple: { ground: '#F6F4F9', surface: '#FFFFFF', text: '#29262F', muted: '#5E5A68', border: '#E2DCEC', accent: '#6A4FA3', onAccent: '#FFFFFF', tint: '#ECE6F6', onTint: '#33245A', tile: '#F0ECF7', chip: '#E7E2EF', field: '#F9F8FB', fieldBorder: '#CFC8DB' }
};
return { c: P[this.props.palette] || P.teal };
}
}
</script>
</body>
</html>
