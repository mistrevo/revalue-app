<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>s06 作り方</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .head { position: absolute; left: 96px; top: 54px; font-size: 76px; font-weight: 700; }
  .steps { position: absolute; left: 96px; top: 186px; width: 560px; }
  .st { position: relative; display: flex; align-items: center; gap: 26px; height: 92px; padding: 0 20px; border-radius: 18px; }
  .st .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #A8B0AD; }
  .st .w { font-size: 40px; color: var(--muted); }
  .rail { position: absolute; left: 30px; top: 46px; width: 2px; height: 460px; background: #C7CEC9; }
  .hi { position: absolute; left: 0; top: 0; width: 100%; height: 92px; background: var(--tint); border-radius: 18px; }
  .stats { position: absolute; left: 116px; top: 776px; }
  .stats div { font-size: 30px; color: var(--on-tint); height: 46px; }

  .frame { position: absolute; left: 704px; top: 186px; width: 1120px; height: 660px; background: #fff; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .shot { position: absolute; inset: 0; background: #fff; overflow: hidden; }
  .shot > img { position: absolute; }
  #sPrd > img { width: 1568px; left: -403px; top: -75px; }
  #sFlow > img { width: 1960px; left: -462px; top: -266px; }
  #sPer > img { width: 1080px; left: 20px; top: 16px; }
  .mark { position: absolute; border: 4px solid var(--accent); border-radius: 12px; }
  #mFlow { left: 119px; top: 354px; width: 985px; height: 180px; }
  .when2 { position: absolute; right: 96px; top: 136px; font-size: 30px; color: var(--muted); }
  #sFix { padding: 34px 40px; background: #fff; }
  .try { position: absolute; left: 40px; width: 1040px; }
  #try1 { top: 26px; }
  #try2 { top: 344px; }
  .try .when { font-size: 28px; color: var(--muted); }
  .try .res { font-size: 56px; font-weight: 700; margin: 2px 0 12px; }
  #try1 .res { color: var(--text); }
  #try2 .res { color: var(--accent); }
  .try img { display: block; width: 1040px; border: 1px solid var(--border); }
  .try img.result { width: 1007px; border: 0; margin-bottom: 8px; }
  .cap { position: absolute; left: 704px; top: 866px; width: 1120px; font-size: 42px; }
</style>
</head>
<body>
  <div class="head" data-ms-text="t50"></div>
  <div class="steps">
    <div class="rail"></div>
    <div class="hi" id="hi"></div>
    <div class="st"><div class="dot"></div><div class="w" data-ms-text="t51"></div></div>
    <div class="st"><div class="dot"></div><div class="w" data-ms-text="t52"></div></div>
    <div class="st"><div class="dot"></div><div class="w" data-ms-text="t53"></div></div>
    <div class="st"><div class="dot"></div><div class="w" data-ms-text="t54"></div></div>
    <div class="st"><div class="dot"></div><div class="w" data-ms-text="t55"></div></div>
    <div class="st"><div class="dot"></div><div class="w" data-ms-text="t56"></div></div>
  </div>
  <div class="stats" id="stats">
    <div data-ms-text="t65"></div>
    <div data-ms-text="t66"></div>
    <div data-ms-text="t67"></div>
  </div>
  <div class="frame">
    <div class="shot" id="sPrd"><img src="../../assets/real-prd.png" alt=""></div>
    <div class="shot" id="sFlow"><img src="../../assets/real-workflow.png" alt=""><div class="mark" id="mFlow"></div></div>
    <div class="shot" id="sFix">
      <div class="try" id="try1">
        <div class="when" data-ms-text="t60"></div>
        <div class="res" data-ms-text="t61"></div>
        <img class="result" src="../../assets/real-fail-result.png" alt="">
        <img src="../../assets/real-fail-row.png" alt="">
      </div>
      <div class="try" id="try2">
        <div class="when" data-ms-text="t62"></div>
        <div class="res" data-ms-text="t63"></div>
        <img class="result" src="../../assets/real-pass-result.png" alt="">
        <img src="../../assets/real-pass-row.png" alt="">
      </div>
    </div>
    <div class="shot" id="sPer"><img src="../../assets/real-persona-table.png" alt=""></div>
  </div>
  <div class="when2" data-ms-text="t68"></div>
  <div class="cap" data-ms-text="t57"></div>
  <div class="cap" data-ms-text="t58"></div>
  <div class="cap" data-ms-text="t59"></div>
  <div class="cap" data-ms-text="t64"></div>
<script>
  const $ = (s) => document.querySelector(s);
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const prog = (t, t0, dur, e = ms.ease.outExpo) => e(clamp01((t - t0) / dur));
  const lerp = (a, b, p) => a + (b - a) * p;
  const T = (id) => $(`[data-ms-text="${id}"]`);
  const STEP = 92;
  const dots = [...document.querySelectorAll('.st .dot')];
  const words = [...document.querySelectorAll('.st .w')];

  // 右の画面の出し方。新しい画面が前の画面の上に重なって入る
  const show = (el, t, t0, tEnd) => {
    const p = prog(t, t0, 0.4, ms.ease.outQuint);
    const visible = t >= t0 && t < tEnd;
    el.style.visibility = visible ? 'visible' : 'hidden';
    el.style.opacity = String(p);
    el.style.transform = `translateY(${lerp(14, 0, p)}px)`;
  };
  const capShow = (id, t) => {
    const { start, end } = ms.time(id);
    const inP = prog(t, start - 0.1, 0.3);
    const outP = prog(t, end - 0.2, 0.2, ms.ease.inQuart);
    T(id).style.opacity = String(inP * (1 - outP));
  };

  ms.scene((t) => {
    const h = prog(t, -0.05, 0.7);
    $('.head').style.opacity = String(h);
    $('.head').style.transform = `translateY(${lerp(14, 0, h)}px)`;
    words.forEach((w, i) => {
      w.parentElement.style.opacity = String(prog(t, ms.time(`t5${i + 1}`).start - 0.05, 0.25));
    });
    $('.rail').style.opacity = String(prog(t, 0.2, 0.3));

    const A = ms.time('t57').start;
    const B = ms.time('t58').start;
    const C = ms.time('t59').start;
    const D = ms.time('t64').start;
    const end = ms.duration;

    show($('#sPrd'), t, A - 0.2, B);
    show($('#sFlow'), t, B, C);
    show($('#sFix'), t, C, D);
    show($('#sPer'), t, D, end + 1);
    ['t57', 't58', 't59', 't64'].forEach((id) => capShow(id, t));

    // いまの段階
    const bLen = (C - B) / 3;
    let at = 0;
    if (t >= B) at = 1;
    if (t >= B + bLen) at = 2;
    if (t >= B + 2 * bLen) at = 3;
    if (t >= C) at = 4;
    if (t >= D) at = 5;
    const moves = [[A - 0.3, 0, 0], [B, 0, 1], [B + bLen, 1, 2], [B + 2 * bLen, 2, 3], [C, 3, 4], [D, 4, 5]];
    let y = 0;
    for (const [m, from, to] of moves) {
      if (t >= m) y = lerp(from, to, prog(t, m, 0.4, ms.ease.inOutCubic)) * STEP;
    }
    $('#hi').style.transform = `translateY(${y}px)`;
    $('#hi').style.opacity = String(prog(t, A - 0.3, 0.3));
    dots.forEach((d, i) => { d.style.background = i === at ? 'var(--accent)' : '#A8B0AD'; });
    words.forEach((w, i) => {
      w.style.color = i === at ? 'var(--on-tint)' : 'var(--muted)';
      w.style.fontWeight = i === at ? '700' : '400';
    });

    // 不合格から合格へ
    $('#try1').style.opacity = String(prog(t, ms.time('t60').start, 0.3));
    const two = prog(t, ms.time('t62').start, 0.45);
    $('#try2').style.opacity = String(two);
    $('#try2').style.transform = `translateY(${lerp(12, 0, two)}px)`;

    // 印
    $('#mFlow').style.opacity = String(prog(t, B + 0.6, 0.25));
    $('#stats').style.opacity = String(prog(t, ms.time('t65').start, 0.35));
    T('t68').style.opacity = String(prog(t, ms.time('t68').start, 0.35));
  });
</script>
</body>
</html>
