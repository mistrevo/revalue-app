<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>s02 何をするものか</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/base.css">
<style>
  .name { position: absolute; left: 96px; top: 120px; font-size: 120px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
  .sub { position: absolute; left: 96px; top: 290px; font-size: 48px; }
  .cards { position: absolute; left: 96px; top: 470px; width: 1728px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 48px; }
  .step { position: relative; height: 310px; padding: 44px 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; }
  .step .h { font-size: 44px; font-weight: 700; line-height: 1.3; min-height: 124px; }
  .step .d { font-size: 30px; color: var(--muted); margin-top: 8px; }
  .step.last { background: var(--accent); border-color: var(--accent); }
  .step.last .h, .step.last .d { color: var(--on-accent); }
  .arrow { position: absolute; right: -40px; top: 139px; width: 32px; height: 32px; z-index: 2; }
</style>
</head>
<body>
  <div class="name" data-ms-text="t20"></div>
  <div class="sub" data-ms-text="t21"></div>
  <div class="cards">
    <div class="step" id="c1">
      <div class="h" data-ms-text="t22"></div><div class="d" data-ms-text="t23"></div>
      <svg class="arrow" viewBox="0 0 32 32"><path d="M10 5l11 11-11 11" fill="none" stroke="#5B6265" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="step" id="c2">
      <div class="h" data-ms-text="t24"></div><div class="d" data-ms-text="t25"></div>
      <svg class="arrow" viewBox="0 0 32 32"><path d="M10 5l11 11-11 11" fill="none" stroke="#5B6265" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="step" id="c3">
      <div class="h" data-ms-text="t26"></div><div class="d" data-ms-text="t27"></div>
      <svg class="arrow" viewBox="0 0 32 32"><path d="M10 5l11 11-11 11" fill="none" stroke="#5B6265" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="step last" id="c4">
      <div class="h" data-ms-text="t28"></div><div class="d" data-ms-text="t29"></div>
    </div>
  </div>
<script>
  const $ = (s) => document.querySelector(s);
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const prog = (t, t0, dur, e = ms.ease.outExpo) => e(clamp01((t - t0) / dur));
  const lerp = (a, b, p) => a + (b - a) * p;
  const pairs = [['#c1', 't22'], ['#c2', 't24'], ['#c3', 't26'], ['#c4', 't28']];

  ms.scene((t) => {
    const n = prog(t, -0.05, 0.7);
    $('.name').style.opacity = String(n);
    $('.name').style.transform = `translateY(${lerp(16, 0, n)}px)`;
    $('.sub').style.opacity = String(prog(t, ms.time('t21').start, 0.4));
    for (const [sel, id] of pairs) {
      const p = prog(t, ms.time(id).start - 0.12, 0.45);
      const el = $(sel);
      el.style.opacity = String(p);
      el.style.transform = `translateY(${lerp(14, 0, p)}px)`;
    }
  });
</script>
</body>
</html>
